name: pi-compute-infinite

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git
        run: |
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config user.name "pi-bot"
          git config user.email "pi-bot@github.actions"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show progress CLI
        run: |
          echo "=== PROGRESS ==="
          cat pi_data/index.json | jq . 2>/dev/null || echo "no index"
          cat pi_data/progress.json | jq . 2>/dev/null || echo "no progress"
          echo "================"

      - name: Compute Pi - FASTEST y-cruncher
        run: |
          python compute.py

      - name: Commit results
        run: |
          git add pi_data/index.json pi_data/progress.json
          git add pi_data/*/*.txt 2>/dev/null || true
          git pull --rebase --autostash origin main || true
          git commit -m "pi: $(cat pi_data/index.json | jq -c .) [$(date -u +%Y-%m-%dT%H:%M:%SZ)]" || echo "nothing to commit"
          git push || true

      - name: Update waiting_next and Trigger next
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, datetime, pathlib
          p=pathlib.Path('pi_data/progress.json')
          d=json.loads(p.read_text())
          d['status']='waiting_next'
          d['last_updated']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(d, indent=2))
          "
          git add pi_data/progress.json
          git pull --rebase --autostash origin main || true
          git commit -m "progress: waiting_next" || true
          git push || true
          echo "Triggering next run..."
          gh workflow run pi-compute.yml || gh workflow run pi-compute-infinite.yml || true
